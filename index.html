    <!-- Spark splash: load the images early -->

    <style>
      /* ---- Spark splash (shown until the app loads, then React replaces it) ---- */
      .ks-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
        background:linear-gradient(160deg,#a855f7 0%,#c155e8 45%,#ec4899 100%);color:#fff;font-family:'Fredoka','Arial Black',sans-serif;text-align:center}
      .ks-splash .ks-sp{position:relative;width:min(52vw,230px);aspect-ratio:1191/1138}
      .ks-splash .ks-sp>*{position:absolute;inset:0;width:100%;height:100%}
      .ks-splash .ks-sp .ks-mouth{inset:auto;left:45.6%;top:52.4%;width:16.3%;height:13.8%}
      .ks-splash .ks-float{animation:ks-float 2.4s ease-in-out infinite}
      .ks-splash .ks-arm{transform-origin:21.33% 53.7%;animation:ks-wave 2.4s ease-in-out infinite}
      .ks-splash .ks-lid{fill:#FDDB06;transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:ks-blink 4s infinite}
      .ks-splash .ks-line{fill:none;stroke:#4A1D7A;stroke-width:9;stroke-linecap:round;opacity:0;animation:ks-line 4s infinite}
      .ks-splash .ks-dots{display:flex;gap:8px;margin-top:10px}
      .ks-splash .ks-dots i{width:11px;height:11px;border-radius:50%;background:#fff;opacity:.5;animation:ks-dot 1.1s ease-in-out infinite}
      .ks-splash .ks-dots i:nth-child(2){animation-delay:.18s}.ks-splash .ks-dots i:nth-child(3){animation-delay:.36s}
      @keyframes ks-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5%)}}
      @keyframes ks-wave{0%{transform:rotate(-4deg)}12%{transform:rotate(-17deg)}28%{transform:rotate(9deg)}44%{transform:rotate(-17deg)}60%{transform:rotate(9deg)}76%,100%{transform:rotate(-4deg)}}
      @keyframes ks-blink{0%,88%,100%{transform:scaleY(0)}92%{transform:scaleY(1)}}
      @keyframes ks-line{0%,89%,100%{opacity:0}90.5%,94%{opacity:1}}
      @keyframes ks-dot{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-8px);opacity:1}}
      @media (prefers-reduced-motion:reduce){.ks-splash *{animation:none!important}}
    </style>

      </div>
    </div>
